schema_version: "0.1.0"
record_type: royalty_cell_manifest

cell_id: urn:royalty-cell:example:missing-allocation-ref
cell_name: Missing Allocation Policy Reference

description: >-
  An intentionally invalid manifest that declares an external allocation
  policy without identifying the external policy.

status: draft

created_at: "2026-07-25T05:00:00+09:00"
updated_at: "2026-07-25T05:00:00+09:00"

cell_scope:
  scope_type: community
  domains:
    - protocol-testing
  purpose: Test allocation-policy reference requirements.

governance:
  mode: steward_led
  authority_refs:
    - urn:royalty-cell-member:example:steward
  decision_policy:
    approval_rule: single_authority

membership:
  admission_mode: open

  roles:
    - role_id: steward
      name: Cell Steward
      permissions:
        - define_allocation_rule
        - issue_royalty_receipt
        - administer_cell

recording_policy:
  origin_registration: role_restricted
  usage_declaration: self_reported
  evidence_requirement: optional
  visibility: members
  retention:
    mode: indefinite

allocation_policy:
  status: external
  allowed_settlement_types:
    - money
    - attribution

interoperability:
  export_enabled: false
  canonical_id_namespace: urn:royalty-cell:example:missing-allocation-ref
  record_formats:
    - json
